# Loki deployment mode
deploymentMode: SingleBinary

# Loki configuration
loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  storage:
    type: filesystem

# SingleBinary deployment
singleBinary:
  replicas: 1

  persistence:
    enabled: true
    size: 2Gi
    whenScaled: Retain
    whenDeleted: Retain
    enableStatefulSetAutoDeletePVC: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

# Disable distributed Loki components
read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

# Disable unnecessary components
minio:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

lokiCanary:
  enabled: false

test:
  enabled: false

# Keep gateway for Fluent Bit and Grafana
gateway:
  enabled: true
